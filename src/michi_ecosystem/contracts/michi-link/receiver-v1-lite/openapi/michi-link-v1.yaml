              schema:
                type: object
                properties:
                  track_id:
                    type: string
                    format: uuid
                  duration:
                    type: number
                    format: float
                    description: Duration in seconds
                  size:
                    type: integer
                    format: int64
                    description: File size in bytes
                  content_type:
                    type: string
                    description: MIME type of the audio
                  bitrate:
                    type: integer
                    description: Bitrate in kbps
                  sample_rate:
                    type: integer
                    description: Sample rate in Hz
                  channels:
                    type: integer
                    description: Number of audio channels
                  format:
                    type: string
                    description: Audio format (mp3, flac, etc.)
                required:
                  - track_id
                  - duration
                  - size
                  - content_type
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

