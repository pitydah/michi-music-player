# Evidence basis: AGENTS.md architectural statements and the test authority
# baseline at SHA fd451afb388cc1e0b2933bb17c2edb5a7ecd95bd
# (M0.1 truth alignment; previous reference a7391335, see
# docs/testing/TEST_AUTHORITY_BASELINE.md).

