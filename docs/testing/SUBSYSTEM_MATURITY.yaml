# Subsystem Maturity — Development Convergence Mode
#
# STATUS: This file is initially a documentary source of truth, NOT an
# automatic gate. Enforcement (gating logic, CI wiring) is PR-B/PR-C scope.
#
# States:
#   experimental  — proof of concept; tests advisory only (T2/T3)
#   development   — active work; tests advisory (T2), T1 candidates when green
#   stabilizing   — contract hardening; T1 candidates, regressions matter
#   stable        — contract trusted; T0/T1 gates apply
#
# Evidence basis: AGENTS.md architectural statements and the test baseline at
# SHA a7391335cdfb5e5c0471a37a432075d739b6e7df (docs/testing/TEST_AUTHORITY_BASELINE.md).

subsystems:
