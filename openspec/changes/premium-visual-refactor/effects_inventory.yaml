  assessment: >
    The QML UI is intentionally lean on GPU effects. The only QtQuick.Effects
    usage is MultiEffect for icon colorization. All visual "glow" effects are
    achieved through gradient overlays on Rectangle primitives.

multi_effects:

  - id: ME01
    file: ui_qml/components/MichiIcon.qml
    lines: "53-58"
    type: MultiEffect
    import: QtQuick.Effects
    config:
      colorization: 1.0
      colorizationColor: root.color
    purpose: >
      Tints SVG/PNG icons to the specified theme color. This is the standard
      approach for symbolic/monochrome icon tinting in Qt Quick.
    source: image item (anchors.fill)
    performance_note: >
      Single MultiEffect per MichiIcon instance. With ~40 icons visible at most
      (sidebar), this is lightweight. No layer.smooth or mipmap on the effect itself.

