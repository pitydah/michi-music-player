# ── Animation / Transition ──
animations:
  total_color_animations: ~15 (ColorAnimation on Behavior blocks)
  total_rotation_animations: 1 (Sidebar chevron)
  total_number_animations: 0
  notes: >
    ColorAnimation is used for hover/press state transitions in:
    - Sidebar items (Behavior on color)
    - GlassMaterial (border.color transitions)
    - NowPlayingBar metadata card (color and border.color)
    - HeaderBar refresh button (RotationAnimator for loading spinner)

# ── Transitions ──
transitions: []
  # Zero Transition elements found. Page transitions use PageStack component.

# ── Performance Assessment ──
performance:
  gpu_overhead: minimal
  rasterization: standard
  concerns: []
  notes: >
    No blur effects, no drop shadows, no layer.enabled, no clipping with
    complex shaders. The only GPU work is:
    1. MultiEffect colorization (cheap, ~40 instances max)
    2. Rectangle anti-aliased borders (native)
    3. Image.Tile for grain texture (lightweight)
    4. Image.PreserveAspectCrop with mipmap for contours (standard)
    5. Gradient Rectangle rendering (native, no shader needed)
    All gradients use standard GradientStop — no conical or complex gradients.
