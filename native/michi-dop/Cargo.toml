[package]
name = "michidop"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Michi DoP carrier element (scoped M13 Gate A evaluation)"

[lib]
name = "michidop"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
glib = "0.22"
gstreamer = { version = "0.25.4", features = ["v1_28"] }
gstreamer-base = { version = "0.25.4", features = ["v1_28"] }
gstreamer-app = { version = "0.25.2", features = ["v1_28"] }
