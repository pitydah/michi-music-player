[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "michi-music-player"
version = "0.1.0"
description = "Michi Music Player — audio-only desktop music player"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.5", "mutagen>=1.47"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.scripts]
michi = "michi.__main__:main"

[tool.pytest.ini_options]
markers = [
    "live_network: opt-in live provider contract tests (MICHI_RUN_LIVE_NETWORK_TESTS=1)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
michi = [
    "presentation/*.qml",
    "presentation/qml/components/*.qml",
    "presentation/qml/assets/*.svg",
    "presentation/qml/controls/*.qml",
    "presentation/qml/dev/*.qml",
    "presentation/qml/media/*.qml",
    "presentation/qml/patterns/*.qml",
    "presentation/qml/playlists/*.qml",
    "presentation/qml/player/*.qml",
    "presentation/qml/primitives/*.qml",
    "presentation/qml/shell/*.qml",
    "presentation/qml/views/*.qml",
    "presentation/qml/theme/*.qml",
    "presentation/qml/theme/qmldir",
    "presentation/qml/ui/*.qml",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/presentation/*bridge.py" = ["N815", "E501"]
"**/test_settings_view.py" = ["N815"]
"**/test_m6_9_presentation_qml.py" = ["N815", "E501"]
"src/michi/application/library_enrichment_job.py" = ["N815"]
"tests/test_m6_9_enrichment_job.py" = ["N815"]
"tests/test_m9_toolbar_enrichment_seam.py" = ["N815"]
"tests/test_pr231_final_review_seal.py" = ["N815"]
"tests/test_m9_r3_contextual_runtime.py" = ["N815"]
"tests/test_library_100_table_structural_completion.py" = ["N815"]
"tests/test_library_lib_a_runtime.py" = ["N815"]
"tests/test_library_lib_a_settings.py" = ["N815"]
"tests/test_library_lib_a_visual_contract.py" = ["N815"]
"tests/test_library_lib_a_seal2.py" = ["N815"]
"tests/test_library_context_host_a1.py" = ["N815"]
"**/infrastructure/sqlite_settings.py" = ["E501"]
"**/infrastructure/qt_backend.py" = ["SIM105"]
"**/bootstrap/__init__.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
