[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "michi-music-player"
version = "0.1.0"
description = "Michi Music Player — audio-only desktop music player"
requires-python = ">=3.11"
# Minimum Qt runtime (POST-R4 P7, lane evidence):
#   - 6.5.x   = UNSUPPORTED (font.features absent; libQt6QuickEffects not
#               shipped by PySide6-Essentials before 6.6.0 on Linux wheels)
#   - 6.6.0   = NOT accepted as a runtime gate (shiboken 6.6.0 breaks
#               QMetaMethod.invoke on the QML runtime gates)
#   - 6.6.2   = MINIMUM TESTED lane (CI min-qt pins PySide6==6.6.2)
# Only 6.6.2+ is validated; the generic floor is >=6.6.0 for pip.
dependencies = [
    "PySide6>=6.6",
    "mutagen>=1.47",
    # DAC-V35-010 (§0G.2): hotplug observation only — never identity,
    # output policy, formats or playback authority.
    "pyudev>=0.24; sys_platform == 'linux'",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.scripts]
michi = "michi.__main__:main"
# DAC-V35-020 (§13): alias para humanos/CI; el producto invoca el módulo
# con sys.executable para provenance determinística.
michi-alsa-probe = "michi.infrastructure.audio_devices.alsa_probe_cli:main"

[tool.pytest.ini_options]
markers = [
    "live_network: opt-in live provider contract tests (MICHI_RUN_LIVE_NETWORK_TESTS=1)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
# POST-R4 P7: los datos viajan SOLO por package-data explícito — el
# include automático (SCM/SOURCES) metía presentation/qml/dev/*.qml en
# el wheel pese a la exclusión.
include-package-data = false

[tool.setuptools.package-data]
michi = [
    "presentation/main.qml",
    "presentation/qml/components/*.qml",
    "presentation/qml/assets/*.svg",
    "presentation/qml/controls/*.qml",
    "presentation/qml/enrichment/*.qml",
    "presentation/qml/media/*.qml",
    "presentation/qml/patterns/*.qml",
    "presentation/qml/playlists/*.qml",
    "presentation/qml/player/*.qml",
    "presentation/qml/primitives/*.qml",
    "presentation/qml/shell/*.qml",
    "presentation/qml/views/*.qml",
    "presentation/qml/theme/*.qml",
    "presentation/qml/theme/qmldir",
    "presentation/qml/ui/*.qml",
]

# POST-R4 P7: el runtime productivo jamás importa presentation/qml/dev
# (MichiUIGallery es una galería de desarrollo): la exclusión es
# EXPLÍCITA aunque un glob amplio o un archivo trackeado por git lo
# arrastre (el parity gate bidireccional de verify_wheel_resources.py
# también lo comprueba sobre el wheel construido).
[tool.setuptools.exclude-package-data]
michi = [
    "presentation/qml/dev/*.qml",
    "presentation/qml/dev/MichiUIGallery.qml",
    "qml/dev/*.qml",
    "qml/dev/MichiUIGallery.qml",
]


[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/presentation/*bridge.py" = ["N815", "E501"]
"**/test_settings_view.py" = ["N815"]
"**/test_m6_9_presentation_qml.py" = ["N815", "E501"]
"src/michi/application/library_enrichment_job.py" = ["N815"]
"tests/test_m6_9_enrichment_job.py" = ["N815"]
"tests/test_m9_toolbar_enrichment_seam.py" = ["N815"]
"tests/test_pr231_final_review_seal.py" = ["N815"]
"tests/test_m9_r3_contextual_runtime.py" = ["N815"]
"tests/test_library_100_table_structural_completion.py" = ["N815"]
"tests/test_library_lib_a_runtime.py" = ["N815"]
"tests/test_library_lib_a_settings.py" = ["N815"]
"tests/test_library_lib_a_visual_contract.py" = ["N815"]
"tests/test_library_lib_a_seal2.py" = ["N815"]
"scripts/installed_wheel_smoke.py" = ["N815"]
"tests/test_library_context_host_a1.py" = ["N815"]
"**/infrastructure/sqlite_settings.py" = ["E501"]
"**/infrastructure/qt_backend.py" = ["SIM105"]
"**/bootstrap/__init__.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
