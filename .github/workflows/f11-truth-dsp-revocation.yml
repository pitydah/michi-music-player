name: F11 Truth DSP terminal receipts

on:
  pull_request:
    branches: [main]
    paths:
      - "src/michi/presentation/signal*bridge.py"
      - "tests/audio_phase2/test_f11*bridge.py"
      - ".github/workflows/f11-truth-dsp-revocation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-dsp-revocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify DSP-to-output evidence on real code
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          python -m pytest -q tests/audio_phase2/test_f11*bridge.py
      - name: Ruff checks
        run: |
          set -euo pipefail
          ruff check src/michi/presentation/signal*bridge.py tests/audio_phase2/test_f11*bridge.py
          ruff format --check src/michi/presentation/signal*bridge.py tests/audio_phase2/test_f11*bridge.py
