name: CI

on: [push, pull_request]

env:
  ruff_out: --output-format=github
  compile_exclude: .venv/|\.tmpl\.

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 xvfb
          pip install ruff
      - name: Ruff check
        run: ruff check . ${{ env.ruff_out }}
      - name: Compileall
        run: python -m compileall -q -x '${{ env.compile_exclude }}' .
      - name: Single authority gate
        run: python scripts/check_single_authority.py
      - name: QML-only gate
        run: python scripts/qml_only_gate.py

  functional-tests:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 python3-gi
          pip install -e ".[dev]" build
      - name: Functional tests
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest tests/qml/functional/ -q --timeout=120 -x --junitxml=results-functional.xml
      - name: Core tests
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest tests/ -q --timeout=300 \
            --ignore=tests/qml --ignore=tests/test_large_library.py \
            --ignore=tests/perf -k "not qt_widget and not QtWidget" \
            -x --deselect tests/test_context_semantic_audit.py::TestContextSemanticAudit::test_no_appevent_import_outside_context \
            --junitxml=results-core.xml
      - name: Runtime route matrix
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest tests/qml/runtime/test_runtime_route_matrix.py -q --timeout=120 --junitxml=results-runtime.xml
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: "*.xml"
          retention-days: 7

  inventory:
    needs: [functional-tests]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 python3-gi
          pip install -e ".[dev]" build
      - name: Full test suite (no -x)
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest tests/ -q --timeout=300 --junitxml=results-inventory.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inventory-results-${{ github.sha }}
          path: results-inventory.xml
          retention-days: 7
