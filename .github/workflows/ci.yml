name: Michi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-multimedia-dev \
            libqt6multimedia6 libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libcairo2-dev libgirepository-2.0-dev pkg-config \
            gir1.2-gstreamer-1.0 gstreamer1.0-alsa \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Install project + test deps
        run: |
          pip install -e ".[test]"
          pip install PyGObject

      - name: Pin QML linter to the supported Qt line
        run: |
          # PySide6 6.12 does not ship the Quick lint plugin categories used
          # by the Premium Library gate. Pin the supported 6.11 line and fail
          # before the gate if its contract is unavailable.
          pip install --force-reinstall \
            "PySide6==6.11.1" "PySide6-Essentials==6.11.1" \
            "PySide6-Addons==6.11.1" "shiboken6==6.11.1"
          python -c "import PySide6; assert PySide6.__version__ == '6.11.1', PySide6.__version__"
          pyside6-qmllint --help | grep -q -- '--Quick.layout-positioning'

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: QML syntax
        run: |
          pyside6-qmllint -I src/michi/presentation/qml \
            src/michi/presentation/qml/**/*.qml

      - name: Premium Library QML warning gate
        run: |
          pyside6-qmllint -W 0 \
            --context-properties disable \
            --unqualified disable \
            --missing-property disable \
            --Quick.layout-positioning error \
            -I src/michi/presentation/qml \
            src/michi/presentation/qml/views/LibraryView.qml \
            src/michi/presentation/qml/views/LibraryHeader.qml \
            src/michi/presentation/qml/views/LibraryToolbar.qml \
            src/michi/presentation/qml/views/LibraryViewOptionsPopup.qml \
            src/michi/presentation/qml/views/AlbumsView.qml \
            src/michi/presentation/qml/views/AlbumDetailView.qml \
            src/michi/presentation/qml/views/AlbumGridView.qml \
            src/michi/presentation/qml/views/AlbumPathView.qml \
            src/michi/presentation/qml/views/VinylWallView.qml \
            src/michi/presentation/qml/views/TimelineView.qml \
            src/michi/presentation/qml/views/MagazineView.qml \
            src/michi/presentation/qml/views/AlbumListView.qml \
            src/michi/presentation/qml/primitives/MichiMaterial.qml \
            src/michi/presentation/qml/primitives/MichiGlassSurface.qml \
            src/michi/presentation/qml/theme/MichiBreakpoints.qml

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build
        run: python -m build

      - name: Verify wheel resource parity
        run: python scripts/verify_wheel_resources.py dist/*.whl

      - name: Installed wheel smoke (clean venv, V4 §22CV)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rm -rf /tmp/michi-wheel-smoke /tmp/michi-wheel-smoke-run
          python -m venv /tmp/michi-wheel-smoke
          /tmp/michi-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/michi-wheel-smoke/bin/python -m pip install dist/*.whl
          mkdir -p /tmp/michi-wheel-smoke-run
          cp scripts/installed_wheel_smoke.py /tmp/michi-wheel-smoke-run/
          cd /tmp/michi-wheel-smoke-run
          env -u PYTHONPATH QT_QPA_PLATFORM=offscreen \
            /tmp/michi-wheel-smoke/bin/python -I installed_wheel_smoke.py

      - name: Render Library visual QA
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/render_library_views_qa.py \
            --output artifacts/library-views

      - name: Upload Library visual QA
        uses: actions/upload-artifact@v4
        with:
          name: library-views-visual-qa
          path: artifacts/library-views
          if-no-files-found: error

      - name: Render Playlists visual QA
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/render_playlists_qa.py \
            --output artifacts/playlists-views

      - name: Upload Playlists visual QA
        uses: actions/upload-artifact@v4
        with:
          name: playlists-views-visual-qa
          path: artifacts/playlists-views
          if-no-files-found: error

  min-qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-multimedia-dev \
            libqt6multimedia6 libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev
      - name: Install project + test deps (minimum PySide6 6.6.2)
        run: |
          pip install -e ".[test]"
          pip install --force-reinstall \
            "PySide6==6.6.2" "PySide6-Essentials==6.6.2" \
            "PySide6-Addons==6.6.2" "shiboken6==6.6.2"
      - name: Minimum-Qt critical runtime gates (V4 §34C)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
          python -m pytest tests/test_m9_r3_contextual_runtime.py -q
          python -m pytest tests/test_m11_3_ui_qml_runtime.py -q
          python -m pytest tests/test_library_visible_recovery_main.py -q

  dac-v35-software-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt, GStreamer, ALSA, and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-multimedia-dev \
            libqt6multimedia6 libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libcairo2-dev libgirepository-2.0-dev pkg-config \
            gir1.2-gstreamer-1.0 gstreamer1.0-alsa \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Install project and closure dependencies
        run: |
          pip install -e ".[test]"
          pip install PyGObject

      - name: Provide a headless audio device for QtMultimedia
        run: |
          sudo apt-get install -y -qq pulseaudio pulseaudio-utils libpulse0 \
            pipewire pipewire-pulse wireplumber
          mkdir -p ~/.config/pipewire
          printf 'context.properties = {}\n' > ~/.config/pipewire/client.conf
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          pulseaudio --start --exit-idle-time=-1 --daemonize=yes || true
          pipewire --version
          pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          sleep 1
          wireplumber > "$RUNNER_TEMP/wireplumber.log" 2>&1 &
          sleep 1
          pactl load-module module-null-sink sink_name=michi_null || true
          pactl set-default-sink michi_null || true
          pactl info || true

      - name: QtMultimedia isolation probe (diagnostic, non-gating)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: ffmpeg
        run: |
          set +e
          python scripts/qt_multimedia_probe.py \
            > "$RUNNER_TEMP/qt_probe.json" 2> "$RUNNER_TEMP/qt_probe.err"
          echo "probe_exit=$?" | tee -a "$RUNNER_TEMP/qt_probe.err"
          cat "$RUNNER_TEMP/qt_probe.json" 2>/dev/null || true
          cat "$RUNNER_TEMP/qt_probe.err" 2>/dev/null || true

      - name: Upload QtMultimedia probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-multimedia-probe
          path: |
            ${{ runner.temp }}/qt_probe.json
            ${{ runner.temp }}/qt_probe.err
            ${{ runner.temp }}/pipewire.log
            ${{ runner.temp }}/wireplumber.log
          if-no-files-found: ignore

      - name: Run commit-bound DAC software closure verifier
        env:
          QT_QPA_PLATFORM: offscreen
          # Headless runner: QtMultimedia's default backend can segfault while
          # enumerating devices with no audio server. The bundled ffmpeg media
          # backend is a supported headless configuration; ALL tests still run
          # (nothing is skipped or disabled).
          QT_MEDIA_BACKEND: ffmpeg
        run: |
          set +e
          python scripts/verify_dac_m11_4.py
          verifier_status=$?
          mkdir -p artifacts
          printf '%s\n' "$verifier_status" > artifacts/dac_m11_4_exit_code
          exit 0

      - name: Upload DAC software closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dac-v35-software-closure-${{ github.sha }}
          path: |
            artifacts/dac_m11_4_verdict.json
            artifacts/dac_m11_4_verdict.md
            artifacts/dac_m11_4_*.log
            artifacts/dac_repository_alignment.json
            artifacts/dac_repository_alignment.md
            artifacts/dac_m11_4_exit_code
          if-no-files-found: error

      - name: Enforce DAC closure verdict and exact SHA
        if: always()
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(cat artifacts/dac_m11_4_exit_code)" = "0"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("artifacts/dac_m11_4_verdict.json").read_text(encoding="utf-8")
          )
          assert report["commit"] == os.environ["EXPECTED_SHA"]
          assert report["ci"]["github_sha"] == os.environ["EXPECTED_SHA"]
          assert report["automated_verdict"] == "GO"
          allowed = {
              "NOT_RUN",
              "INCOMPLETE",
              "FAIL",
              "PASS_BOUNDED",
              "PASS_MULTI_HARDWARE",
          }
          assert report["physical_verdict"] in allowed
          assert report["implementation_verdict"] in {"COMPLETE", "INCOMPLETE"}
          assert report["physical_tooling_verdict"] in {"COMPLETE", "INCOMPLETE"}
          assert report["multi_hardware_verdict"] in {
              "PASS_MULTI_HARDWARE",
              "NOT_PROVEN",
          }
          if report["physical_verdict"] == "PASS_MULTI_HARDWARE":
              assert report["multi_hardware_verdict"] == "PASS_MULTI_HARDWARE"
          PY

  dop-native-gate-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GStreamer native + Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgirepository-2.0-dev libcairo2-dev \
            gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-alsa gstreamer1.0-tools
          pip install -e ".[test]"
          pip install PyGObject

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Rust format, clippy, tests (locked)
        run: |
          cargo fmt --manifest-path native/michi-dop/Cargo.toml -- --check
          cargo clippy --manifest-path native/michi-dop/Cargo.toml \
            --release --all-targets --locked -- -D warnings
          cargo test --manifest-path native/michi-dop/Cargo.toml --release --locked

      - name: Install private Gate A prefix and prove discovery
        run: |
          cargo build --manifest-path native/michi-dop/Cargo.toml --release --locked
          prefix="$RUNNER_TEMP/michi-dop-gate-a"
          native/michi-dop/install-private.sh "$prefix"
          GST_PLUGIN_PATH="$prefix/lib/gstreamer-1.0" gst-inspect-1.0 michidop
          GST_PLUGIN_PATH="$prefix/lib/gstreamer-1.0" MICHI_DOP_INSTALLED=1 \
            cargo test --manifest-path native/michi-dop/Cargo.toml \
              --release --locked --test corpus

      - name: Supervised host DoP vertical (fakesink lab)
        env:
          MICHI_DOP_PREFIX: ${{ runner.temp }}/michi-dop-gate-a
          GST_PLUGIN_PATH: ${{ runner.temp }}/michi-dop-gate-a/lib/gstreamer-1.0
          MICHI_GST_LAB_SINK: fakesink
        run: |
          python -m pytest tests/audio_phase2/test_dop_host_runtime.py \
            tests/audio_phase2/test_dop_product_e2e.py -q

      - name: Build and install platform wheel
        run: |
          MICHI_BUILD_DOP=1 python -m build --wheel --outdir dist-native
          rm -rf /tmp/michi-dop-wheel
          python -m venv --system-site-packages /tmp/michi-dop-wheel
          /tmp/michi-dop-wheel/bin/pip install --no-deps dist-native/*.whl
          prefix=$(/tmp/michi-dop-wheel/bin/python -c \
            'from michi.infrastructure.audio_output.dop_plugin import resolve_dop_prefix; print(resolve_dop_prefix())')
          test -f "$prefix/libmichidop.so"
          test -f "$prefix/michidop.manifest.json"
          GST_PLUGIN_PATH="$prefix" gst-inspect-1.0 michidop

      - name: Installed wheel DoP end-to-end (fail closed)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          prefix=$(/tmp/michi-dop-wheel/bin/python -c \
            'from michi.infrastructure.audio_output.dop_plugin import resolve_dop_prefix; print(resolve_dop_prefix())')
          rm -rf /tmp/michi-dop-installed-run
          mkdir -p /tmp/michi-dop-installed-run
          cp scripts/verify_installed_dop_e2e.py /tmp/michi-dop-installed-run/
          cd /tmp/michi-dop-installed-run
          env -u PYTHONPATH -u MICHI_DOP_PREFIX \
            GST_PLUGIN_PATH="$prefix" \
            MICHI_DOP_PLUGIN_PREFIX="$prefix" \
            MICHI_GST_LAB_SINK=fakesink \
            /tmp/michi-dop-wheel/bin/python -I verify_installed_dop_e2e.py \
              --json-output installed-dop-e2e.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("installed-dop-e2e.json").read_text())
          assert report["status"] == "PASS", report
          assert report["skipped"] is False, report
          assert report["plugin_sha256"], report
          print("installed wheel e2e: PASS")
          PY
          cp installed-dop-e2e.json "$GITHUB_WORKSPACE/artifacts/installed-dop-e2e.json"

      - name: Record artifact digest
        run: |
          mkdir -p artifacts
          sha256sum native/michi-dop/target/release/libmichidop.so \
            > artifacts/michidop-gate-a.sha256
          cat artifacts/michidop-gate-a.sha256

      - name: Upload native evidence
        uses: actions/upload-artifact@v4
        with:
          name: michidop-gate-a-${{ github.sha }}
          path: |
            artifacts/michidop-gate-a.sha256
            artifacts/installed-dop-e2e.json
          if-no-files-found: error
