name: CI

on: [push, pull_request]

env:
  ruff_out: --output-format=github
  compile_exclude: .venv/|\.tmpl\.

jobs:
  # ── BLOCKING JOBS — required for merge. Failures block the PR. ──
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 xvfb
          pip install ruff
      - name: Ruff check
        run: ruff check . ${{ env.ruff_out }}
      - name: Compileall
        run: python -m compileall -q -x '${{ env.compile_exclude }}' .
      - name: Single authority gate
        run: python scripts/check_single_authority.py
      - name: QML-only gate
        run: python scripts/qml_only_gate.py
      - name: Patch artifact gate
        run: python scripts/check_patch_artifacts.py

  composition-productive:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 python3-gi
          pip install -e ".[dev]"
      - name: Composition root productive smoke test
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python scripts/smoke_composition.py

  # T0 safety gate — blocking.
  # Runs scripts/test_gate.sh from PR-B (feat/test-authority-infra).
  # PR-C is dependency-clean: if test_gate.sh is absent (PR-B not merged
  # yet), the job falls back to the inline equivalent: ruff + compileall +
  # the 3 authority gates + composition smoke + gate-marked tests.
  t0-safety-gate:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 python3-gi
          pip install -e ".[dev]" build
      - name: T0 safety gate
        run: |
          if [ -f scripts/test_gate.sh ]; then
            # PR-B (feat/test-authority-infra) merged: canonical gate script.
            bash scripts/test_gate.sh
          else
            # PR-B NOT merged: inline equivalent of test_gate.sh.
            ruff check . ${{ env.ruff_out }}
            python -m compileall -q -x '${{ env.compile_exclude }}' .
            python scripts/check_single_authority.py
            python scripts/qml_only_gate.py
            python scripts/check_patch_artifacts.py
            QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python scripts/smoke_composition.py
            if grep -q '"gate"' pyproject.toml; then
              QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest -m gate -q --timeout=300
            else
              echo "PR-B not merged: gate markers absent - gate tests run inside the unit job"
            fi
          fi

  unit:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 python3-gi
          pip install -e ".[dev]" build
      - name: Unit tests
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest tests/ -q --timeout=300 \
            --ignore=tests/qml --ignore=tests/test_large_library.py \
            --ignore=tests/perf -k "not qt_widget and not QtWidget" \
            --deselect tests/test_context_semantic_audit.py::TestContextSemanticAudit::test_no_appevent_import_outside_context \
            --junitxml=results-unit.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results-${{ github.sha }}
          path: results-unit.xml
          retention-days: 7

  audio-integration:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 python3-gi
          pip install -e ".[dev]"
      - name: Audio integration tests
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest \
            tests/test_audio_backend_base.py \
            tests/test_hybrid_audio_manager.py \
            tests/test_audio_contract.py \
            tests/test_audio_profile_backend_selection.py \
            tests/test_audio_settings_schema.py \
            tests/test_audio_settings_migrator.py \
            -q --timeout=120 --junitxml=results-audio.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-integration-results-${{ github.sha }}
          path: results-audio.xml
          retention-days: 7

  ai-v2:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 python3-gi
          pip install -e ".[dev]"
      - name: Michi AI V2 tests
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest \
            tests/test_michi_ai.py \
            tests/test_michi_ai_lite.py \
            tests/test_michi_ai_engine_unified.py \
            tests/test_michi_ai_advanced.py \
            tests/test_michi_ai_action_registry.py \
            tests/test_michi_ai_backend_selector.py \
            tests/test_michi_ai_model_manager.py \
            tests/test_michi_ai_privacy.py \
            tests/test_michi_ai_risk_policy.py \
            tests/test_michi_ai_security.py \
            tests/test_michi_ai_bridge.py \
            tests/test_ai_queue_tools.py \
            tests/test_ai_assistant_context_hints.py \
            -q --timeout=120 --junitxml=results-ai-v2.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-v2-results-${{ github.sha }}
          path: results-ai-v2.xml
          retention-days: 7

  qml-runtime:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 python3-gi
          pip install -e ".[dev]" build
      - name: Runtime route matrix
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest tests/qml/runtime/test_runtime_route_matrix.py -q --timeout=120 --junitxml=results-runtime.xml
      - name: Route reintegration gate
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest \
            tests/qml/runtime/test_page_stack_last_request_wins.py \
            tests/qml/runtime/test_capability_does_not_block_route.py \
            tests/qml/runtime/test_disc_lab_route.py \
            tests/qml/runtime/test_e2e_navigation_sequence.py \
            tests/qml/runtime/test_runtime_productive_gate.py \
            tests/qml/library/test_album_view_productive_layout.py \
            -q --timeout=300 --junitxml=results-reintegration.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qml-runtime-results-${{ github.sha }}
          path: |
            results-runtime.xml
            results-reintegration.xml
          retention-days: 7

  # ── ADVISORY JOB — visible, NOT required. ──
  # development-quarantine surfaces quarantine/development debt.
  # A failure here is an ADVISORY FAILURE, never a BLOCKING FAILURE.
  # Do NOT add this job to the required checks in branch protection.
  development-quarantine:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 python3-gi
          pip install -e ".[dev]" build
      - name: "ADVISORY: development + quarantine tests (failure = ADVISORY FAILURE, never BLOCKING FAILURE)"
        # ADVISORY RUN — a red step here is an ADVISORY FAILURE (non-blocking).
        # This job is intentionally NOT part of the required checks.
        run: |
          echo "ADVISORY run: failures below are ADVISORY FAILURES, not merge blockers"
          if [ -f scripts/test_development.sh ] && [ -f scripts/test_quarantine.sh ]; then
            bash scripts/test_development.sh
            bash scripts/test_quarantine.sh
          elif grep -q '"development"' pyproject.toml; then
            QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest -m "development or quarantine" -q --timeout=300 --junitxml=results-advisory.xml
          else
            echo "ADVISORY SKIPPED: PR-B (feat/test-authority-infra) not merged - markers absent"
          fi
      - name: "ADVISORY: functional subset (ex-functional-tests job)"
        # The former functional-tests job also ran the vertical
        # tagging/disc_lab/settings/queue/playback subsets; those are now
        # covered by the quarantine advisory run above. tests/qml/functional
        # stays green locally and is folded in here.
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest tests/qml/functional/ -q --timeout=120 --junitxml=results-functional.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisory-results-${{ github.sha }}
          path: "*.xml"
          retention-days: 7

  # ── DIAGNOSTIC JOB — visible, NOT required. ──
  # full-inventory runs the ENTIRE suite with no ignores. Diagnostic
  # inventory, not a merge gate; may fail while legacy/quarantine debt
  # is triaged. A red inventory is a signal, NOT a blocker.
  full-inventory:
    needs: [composition-productive, t0-safety-gate, unit, audio-integration, ai-v2, qml-runtime]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 python3-gi
          pip install -e ".[dev]" build
      - name: Full test suite (no -x)
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=/usr/lib/python3/dist-packages python -m pytest tests/ -q --timeout=300 --junitxml=results-inventory.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-results-${{ github.sha }}
          path: results-inventory.xml
          retention-days: 7
