name: Michi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-multimedia-dev \
            libqt6multimedia6 libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev

      - name: Install project + test deps
        run: pip install -e ".[test]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: QML syntax
        run: |
          pyside6-qmllint -I src/michi/presentation/qml \
            src/michi/presentation/qml/**/*.qml

      - name: Premium Library QML warning gate
        run: |
          pyside6-qmllint -W 0 \
            --context-properties disable \
            --unqualified disable \
            --missing-property disable \
            --Quick.layout-positioning error \
            -I src/michi/presentation/qml \
            src/michi/presentation/qml/views/LibraryView.qml \
            src/michi/presentation/qml/views/LibraryHeader.qml \
            src/michi/presentation/qml/views/LibraryToolbar.qml \
            src/michi/presentation/qml/views/LibraryViewOptionsPopup.qml \
            src/michi/presentation/qml/views/AlbumsView.qml \
            src/michi/presentation/qml/views/AlbumDetailView.qml \
            src/michi/presentation/qml/views/AlbumGridView.qml \
            src/michi/presentation/qml/views/AlbumPathView.qml \
            src/michi/presentation/qml/views/VinylWallView.qml \
            src/michi/presentation/qml/views/TimelineView.qml \
            src/michi/presentation/qml/views/MagazineView.qml \
            src/michi/presentation/qml/views/AlbumListView.qml \
            src/michi/presentation/qml/primitives/MichiMaterial.qml \
            src/michi/presentation/qml/primitives/MichiGlassSurface.qml \
            src/michi/presentation/qml/theme/MichiBreakpoints.qml

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build
        run: python -m build

      - name: Verify wheel resource parity
        run: python scripts/verify_wheel_resources.py dist/*.whl

      - name: Installed wheel smoke (clean venv, V4 §22CV)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rm -rf /tmp/michi-wheel-smoke /tmp/michi-wheel-smoke-run
          python -m venv /tmp/michi-wheel-smoke
          /tmp/michi-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/michi-wheel-smoke/bin/python -m pip install dist/*.whl
          mkdir -p /tmp/michi-wheel-smoke-run
          cp scripts/installed_wheel_smoke.py /tmp/michi-wheel-smoke-run/
          cd /tmp/michi-wheel-smoke-run
          env -u PYTHONPATH QT_QPA_PLATFORM=offscreen \
            /tmp/michi-wheel-smoke/bin/python -I installed_wheel_smoke.py

      - name: Render Library visual QA
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/render_library_views_qa.py \
            --output artifacts/library-views

      - name: Upload Library visual QA
        uses: actions/upload-artifact@v4
        with:
          name: library-views-visual-qa
          path: artifacts/library-views
          if-no-files-found: error

      - name: Render Playlists visual QA
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/render_playlists_qa.py \
            --output artifacts/playlists-views

      - name: Upload Playlists visual QA
        uses: actions/upload-artifact@v4
        with:
          name: playlists-views-visual-qa
          path: artifacts/playlists-views
          if-no-files-found: error

  min-qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-multimedia-dev \
            libqt6multimedia6 libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libqt6quickcontrols2-6 libqt6quicktemplates2-6 libqt6quickeffects6 \
            qml6-module-qtquick-effects
      - name: Install project + test deps (minimum PySide6 6.5.0)
        run: |
          pip install -e ".[test]"
          pip install --force-reinstall \
            "PySide6==6.5.0" "PySide6-Essentials==6.5.0" \
            "PySide6-Addons==6.5.0" "shiboken6==6.5.0"
      - name: Minimum-Qt critical runtime gates (V4 §34C)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
          python -m pytest tests/test_m9_r3_contextual_runtime.py -q
          python -m pytest tests/test_m11_3_ui_qml_runtime.py -q
          python -m pytest tests/test_library_visible_recovery_main.py -q
